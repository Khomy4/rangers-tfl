<!doctype html>

<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rangers TFL</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0d0d0d;color:#f0f0f0;min-height:100vh;padding-bottom:76px}
button{cursor:pointer;font-family:inherit;border:none;outline:none}
input,select,option{font-family:inherit;outline:none}

/* Header */
.hdr{padding:18px 16px 14px;background:#111;border-bottom:1px solid #1e1e1e}
.hdr-row{display:flex;align-items:center;justify-content:space-between}
.hdr-title{font-size:22px;font-weight:900;letter-spacing:-.5px}
.hdr-badge{font-size:11px;font-weight:700;background:#1d4ed8;color:#fff;padding:3px 9px;border-radius:20px}
.hdr-sub{font-size:12px;color:#666;margin-top:3px}

/* Bottom Nav */
.nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:#111;border-top:1px solid #1e1e1e;z-index:100;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 8px;font-size:10px;font-weight:600;color:#555;background:none;transition:.12s color}
.nav-btn.on{color:#3b82f6}
.nav-icon{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Pages */
.pg{display:none;padding:12px 14px 4px}
.pg.on{display:block}

/* Cards */
.card{background:#1a1a1a;border-radius:16px;padding:14px 16px;margin-bottom:10px;border:1px solid #222}
.card-sm{background:#1a1a1a;border-radius:12px;padding:10px 14px;margin-bottom:8px;border:1px solid #222}

/* Match card */
.mc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.mc-opp{font-size:17px;font-weight:700}
.mc-date{font-size:12px;color:#777;margin-top:3px}
.mc-score{font-size:30px;font-weight:900;flex-shrink:0;line-height:1}
.win{color:#22c55e}.loss{color:#ef4444}.draw{color:#f59e0b}
.mc-bonus{font-size:12px;color:#777;margin:7px 0 0}
.mc-bonus b{color:#22c55e}

/* Deadline bar */
.dl-bar{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:7px 10px;border-radius:9px;margin:9px 0 0}
.dl-ok{background:#1c2a0f;color:#86efac}
.dl-warn{background:#2a1f00;color:#fbbf24}
.dl-gone{background:#2a0808;color:#f87171}

/* RSVP buttons */
.rsvp-row{display:flex;gap:8px;margin-top:10px}
.btn-yes{background:#14532d;color:#4ade80;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:700;flex:1}
.btn-yes.on,.btn-yes:active{background:#16a34a;color:#fff}
.btn-no{background:#450a0a;color:#f87171;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:700;flex:1}
.btn-no.on,.btn-no:active{background:#dc2626;color:#fff}
.btn-primary{background:#1d4ed8;color:#fff;border-radius:10px;padding:11px;font-size:14px;font-weight:700;width:100%;text-align:center;display:block}
.btn-primary:active{background:#1e40af}
.btn-ghost{background:#1e1e1e;color:#aaa;border-radius:10px;padding:11px;font-size:14px;font-weight:700;width:100%;text-align:center;display:block;border:1px solid #2e2e2e}
.btn-danger{background:#450a0a;color:#f87171;border-radius:10px;padding:11px;font-size:14px;font-weight:700;width:100%;text-align:center;display:block}
.btn-sm{padding:6px 12px;font-size:12px;font-weight:700;border-radius:8px}

/* Section label */
.sect{font-size:11px;font-weight:700;color:#555;letter-spacing:.6px;text-transform:uppercase;margin:14px 0 8px}

/* Status chips */
.chip{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px}
.chip-yes{background:#14532d;color:#4ade80}
.chip-no{background:#450a0a;color:#f87171}
.chip-pending{background:#1e1e1e;color:#666}
.chip-gold{background:#422006;color:#fbbf24}
.chip-blue{background:#1e3658;color:#60a5fa}
.chip-green{background:#14532d;color:#4ade80}
.chip-gray{background:#1e1e1e;color:#888}

/* Leaderboard */
.lb-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #1e1e1e}
.lb-row:last-child{border:none}
.lb-rank{font-size:15px;font-weight:900;color:#555;width:26px;text-align:center;flex-shrink:0}
.lb-info{flex:1;min-width:0}
.lb-info b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.lb-detail{font-size:11px;color:#666;margin-top:1px}
.lb-pts{font-size:22px;font-weight:900;color:#3b82f6;flex-shrink:0}

/* Bank */
.bank-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.bank-cell{background:#1a1a1a;border-radius:14px;padding:14px;border:1px solid #222}
.bank-val{font-size:22px;font-weight:900;margin-top:4px}
.bank-lbl{font-size:11px;color:#777;font-weight:600}

/* Form */
.form-lbl{font-size:12px;color:#777;font-weight:600;margin-bottom:4px;display:block}
.form-in{background:#111;border:1px solid #2e2e2e;color:#f0f0f0;border-radius:10px;padding:11px 13px;font-size:15px;width:100%;margin-bottom:12px}
.form-in:focus{border-color:#3b82f6}
.form-sel{background:#111;border:1px solid #2e2e2e;color:#f0f0f0;border-radius:10px;padding:11px 13px;font-size:15px;width:100%;margin-bottom:12px;-webkit-appearance:none}

/* Detail page */
.det-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back-btn{background:#1a1a1a;border:1px solid #222;border-radius:10px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.back-icon{width:18px;height:18px;stroke:#f0f0f0;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.det-title{font-size:18px;font-weight:800}
.det-score{font-size:52px;font-weight:900;text-align:center;padding:18px 0 4px;line-height:1}
.det-teams{display:flex;justify-content:space-between;font-size:12px;color:#666;padding:0 2px;margin-bottom:12px}

/* Stat row */
.st-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #1e1e1e}
.st-row:last-child{border:none}
.st-name{flex:1;min-width:0}
.st-name b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.st-name span{font-size:11px;color:#666}
.st-chips{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.st-pts{font-size:16px;font-weight:900;color:#3b82f6;flex-shrink:0;min-width:22px;text-align:right}

/* RSVP player row */
.rv-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #1e1e1e}
.rv-row:last-child{border:none}
.rv-icon{font-size:15px;flex-shrink:0;width:20px;text-align:center}
.rv-name{flex:1;font-size:14px}
.rv-pos{font-size:11px;color:#666;margin-left:4px}
.rv-late{font-size:10px;color:#f59e0b;flex-shrink:0}
.rv-btns{display:flex;gap:4px;flex-shrink:0}

/* Player position row */
.pl-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #1e1e1e}
.pl-row:last-child{border:none}
.pl-name{flex:1;font-size:14px;font-weight:600}

/* Empty / loading */
.empty{text-align:center;padding:48px 20px;color:#444}
.empty-ic{font-size:44px;margin-bottom:10px}
.empty-tx{font-size:14px}
.loading{text-align:center;padding:40px;color:#444;font-size:14px}

/* Toast */
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#1d4ed8;color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;font-weight:700;z-index:999;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center}
.toast.on{opacity:1}

/* Pitch (lineup) */
.pitch2{position:relative;width:100%;aspect-ratio:9/14;border-radius:10px;overflow:hidden;background:linear-gradient(180deg,#1a4a16 0%,#1e5a1a 14.28%,#22641e 28.56%,#1e5a1a 42.84%,#1a4a16 57.12%,#1e5a1a 71.4%,#22641e 85.68%)}
.pitch2 svg{position:absolute;inset:0;width:100%;height:100%}
.pt{position:absolute;display:flex;flex-direction:column;align-items:center;cursor:pointer;transform:translate(-50%,-50%);z-index:10}
.pt-c{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;border:2px solid rgba(255,255,255,.25);box-shadow:0 3px 10px rgba(0,0,0,.5);user-select:none;transition:transform .15s}
.pt-c.out{background:#f0c030;color:#000}.pt-c.gk{background:#e05060;color:#fff}.pt-c.emp{background:rgba(255,255,255,.08);color:rgba(255,255,255,.35);border:2px dashed rgba(255,255,255,.2)}
.pt:hover .pt-c{transform:scale(1.1)}
.pt-n{margin-top:4px;font-size:10px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.9);white-space:nowrap;max-width:72px;overflow:hidden;text-overflow:ellipsis;text-align:center}
.lp-overlay{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.7);display:none;align-items:flex-end}
.lp-overlay.open{display:flex}
.lp-sheet{width:100%;max-width:430px;margin:0 auto;background:#1e1e1e;border-radius:20px 20px 0 0;padding:16px 14px 28px;max-height:60vh;overflow-y:auto}
.lp-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;transition:background .1s;margin-bottom:4px}
.lp-row:hover{background:#2a2a2a}
.lp-av{width:34px;height:34px;border-radius:50%;background:#f0c030;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#000;flex-shrink:0}
.lp-av.kp{background:#e05060;color:#fff}
.lp-clr{margin-top:8px;padding:10px;text-align:center;font-size:13px;color:#ef4444;cursor:pointer;border-radius:10px}
.lp-clr:hover{background:rgba(239,68,68,.1)}
/* Sub badges */
.sub-badges{position:absolute;right:-7px;bottom:-7px;display:flex;flex-direction:column-reverse;gap:1px;pointer-events:none}
.sub-bdg{position:relative;width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.sub-bdg svg{position:absolute;inset:0;width:100%;height:100%}
.sub-av-m{position:relative;z-index:2;width:13px;height:13px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:5.5px;font-weight:900;color:#000;background:#f0c030;box-shadow:0 1px 3px rgba(0,0,0,.6)}
.sub-av-m.kp{background:#e05060;color:#fff}
/* Team switcher */
.team-sw{display:flex;gap:2px;background:#111;border-radius:8px;padding:3px;flex-shrink:0}
.team-sw-btn{width:30px;height:24px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;border-radius:6px;cursor:pointer;color:#666;transition:background .15s,color .15s;user-select:none}
.team-sw-btn.active{background:#4a9a40;color:#fff}
/* Formation switcher */
.fm-sw{display:flex;gap:2px;background:#111;border-radius:8px;padding:3px;flex-shrink:0}
.fm-sw-btn{height:24px;padding:0 7px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border-radius:6px;cursor:pointer;color:#666;transition:background .15s,color .15s;user-select:none;white-space:nowrap}
.fm-sw-btn.active{background:#3a7ac0;color:#fff}
/* Position info sheet */
.pi-overlay{position:fixed;inset:0;z-index:600;background:rgba(0,0,0,.65);display:none;align-items:flex-end}
.pi-overlay.open{display:flex}
.pi-sheet{width:100%;max-width:430px;margin:0 auto;background:#1a1a1a;border-radius:20px 20px 0 0;padding:16px 14px 32px;max-height:70vh;overflow-y:auto}
.pi-player{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #2a2a2a;margin-bottom:12px}
.pi-av{width:42px;height:42px;border-radius:50%;background:#f0c030;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#000;flex-shrink:0}
.pi-av.kp{background:#e05060;color:#fff}
.pi-sub-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;margin-bottom:4px}
.pi-sub-row.clickable{cursor:pointer;transition:background .1s}
.pi-sub-row.clickable:hover{background:#2a2a2a}
.pi-sub-av{width:28px;height:28px;border-radius:50%;background:#2a2a2a;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;color:#aaa;flex-shrink:0}
.pi-sub-av.filled{background:#f0c030;color:#000}
.pi-sub-av.filled.kp{background:#e05060;color:#fff}
.pi-act-row{display:flex;gap:8px;margin-top:12px}
.pi-act{flex:1;padding:10px;border-radius:10px;text-align:center;font-size:13px;font-weight:700;cursor:pointer;border:none;outline:none}
.pi-act.change{background:#2a2a2a;color:#eee}
.pi-act.remove{background:rgba(239,68,68,.15);color:#ef4444}
/* Notes block */
.notes-blk{background:#1a1a1a;border-radius:14px;padding:14px 14px 16px;margin-top:12px}
.notes-ta{width:100%;background:#111;border:1px solid #2a2a2a;border-radius:10px;padding:10px 12px;color:#eee;font-size:14px;line-height:1.5;resize:none;min-height:80px;font-family:inherit;box-sizing:border-box}
.notes-ta:focus{outline:none;border-color:#4a9a40}
.notes-ro{font-size:14px;color:#ccc;line-height:1.6;white-space:pre-wrap}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-row">
    <span class="hdr-title">🏆 Rangers</span>
    <span class="hdr-badge" id="seasonBadge">Сезон 1</span>
  </div>
  <div class="hdr-sub" id="hdrSub">Загрузка...</div>
</div>

<nav class="nav">
  <button class="nav-btn on" onclick="goPage('matches')">
    <svg class="nav-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    Матчи
  </button>
  <button class="nav-btn" onclick="goPage('rating')">
    <svg class="nav-icon" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    Рейтинг
  </button>
  <button class="nav-btn" onclick="goPage('bank')">
    <svg class="nav-icon" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
    Банк
  </button>
  <button class="nav-btn" id="capNavBtn" onclick="goPage('captain')" style="display:none">
    <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
    Капитан
  </button>
</nav>

<div id="pg-matches" class="pg on"></div>
<div id="pg-detail" class="pg"></div>
<div id="pg-rating" class="pg"></div>
<div id="pg-bank" class="pg"></div>
<div id="pg-captain" class="pg"></div>

<div class="lp-overlay" id="lpOverlay" onclick="if(event.target===this)closeLPicker()">
  <div class="lp-sheet">
    <div style="font-size:15px;font-weight:700;margin-bottom:4px">Выбери игрока</div>
    <div style="font-size:11px;color:#666;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px" id="lpPos"></div>
    <div id="lpList"></div>
    <div class="lp-clr" onclick="if(piMode==='main')clearLP(lpState.slot,lpState.mid);else{if(lpSubs[lpState.slot])lpSubs[lpState.slot].splice(lpState.subIdx,1);closeLPicker();renderPitchTokens();if(lpState.slot)openPosInfo(lpState.slot,lpState.mid);}">✕ Убрать игрока</div>
  </div>
</div>

<div class="pi-overlay" id="piOverlay" onclick="if(event.target===this)closePosInfo()">
  <div class="pi-sheet" id="piSheet"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const initData = tg?.initData || "";
const H = {"Content-Type":"application/json","X-Telegram-Init-Data":initData};

let S = { me:null, matches:[], players:[], seasons:[], lb:[], summary:null };
let activePage = "matches";
let prevPage = "matches";
let detailMatchId = null;

// ── Helpers ───────────────────────────────────────────────────────────────────
const rub = n => new Intl.NumberFormat("ru-RU").format(n) + " ₽";
const esc = s => String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function toast(msg, ms=2600) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("on");
  setTimeout(() => el.classList.remove("on"), ms);
}

async function api(url, opts={}) {
  const r = await fetch(url, {...opts, headers:{...H,...(opts.headers||{})}});
  if (!r.ok) throw new Error(await r.text() || String(r.status));
  return r.json();
}

function goPage(page) {
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("on"));
  document.querySelector(`.nav-btn[onclick="goPage('${page}')"]`)?.classList.add("on");
  document.querySelectorAll(".pg").forEach(p => p.classList.remove("on"));
  document.getElementById(`pg-${page}`)?.classList.add("on");
  activePage = page;
}

function openDetail(mid) {
  prevPage = activePage;
  document.querySelectorAll(".nav-btn,.pg").forEach(x => x.classList.remove("on"));
  document.getElementById("pg-detail").classList.add("on");
  activePage = "detail";
  detailMatchId = mid;
  renderDetail(mid);
}

function back() { goPage(prevPage); }

// ── Boot ──────────────────────────────────────────────────────────────────────
async function boot() {
  try {
    [S.me, S.players, S.matches, S.seasons] = await Promise.all([
      api("/api/me"), api("/api/players"), api("/api/matches"), api("/api/seasons")
    ]);
    const s = S.seasons.find(x => x.active) || S.seasons[0];
    if (s) document.getElementById("seasonBadge").textContent = s.name;
    document.getElementById("hdrSub").textContent =
      S.me.player.name + (S.me.captain ? " · капитан" : "");

    // Not approved yet — show waiting screen
    if (!S.me.captain && !S.me.player.approved) {
      document.getElementById("pg-matches").innerHTML =
        `<div class="empty" style="padding-top:80px">
           <div class="empty-ic">⏳</div>
           <div class="empty-tx" style="font-size:16px;font-weight:700;color:#f0f0f0;margin-bottom:8px">Ожидаем подтверждения</div>
           <div class="empty-tx" style="color:#666">Капитан должен одобрить твой аккаунт.<br>Как только он это сделает — всё откроется.</div>
         </div>`;
      return;
    }

    if (S.me.captain) document.getElementById("capNavBtn").style.display = "";
    renderMatches();
    loadRating();
    loadBank();
    if (S.me.captain) renderCaptain();
  } catch(e) {
    document.getElementById("pg-matches").innerHTML =
      `<div class="empty"><div class="empty-ic">⚠️</div><div class="empty-tx">${esc(e.message)}</div></div>`;
  }
}


function disciplineHtml(m) {
  if (!m.finance || m.finance.discipline === undefined) return "";
  // Only show section if match has a score
  if (m.gf === null) return "";
  const f = m.finance;
  const ok = f.discipline_ok;  // null=pending, 1=yes, 0=no
  const isCap = S.me && S.me.captain;
  const statusHtml = ok === 1
    ? `<span style="color:#22c55e;font-weight:700">✅ Соблюдена (+300 ₽)</span>`
    : ok === 0
    ? `<span style="color:#e05060;font-weight:700">❌ Не соблюдена (0 ₽)</span>`
    : `<span style="color:#888">⏳ Не подтверждена капитаном</span>`;
  const btnHtml = isCap ? `
    <div style="display:flex;gap:8px;margin-top:10px">
      <button onclick="setDiscipline(${m.id},true)" style="flex:1;padding:8px;border-radius:10px;border:none;background:${ok===1?'#22c55e':'#1a3a1a'};color:${ok===1?'#000':'#22c55e'};font-weight:700;cursor:pointer;font-size:13px">✅ Соблюдена</button>
      <button onclick="setDiscipline(${m.id},false)" style="flex:1;padding:8px;border-radius:10px;border:none;background:${ok===0?'#e05060':'#3a1a1a'};color:${ok===0?'#fff':'#e05060'};font-weight:700;cursor:pointer;font-size:13px">❌ Нарушена</button>
    </div>` : "";
  return `
<div class="sect">Дисциплина</div>
<div class="card" style="padding:14px">
  <div style="font-size:13px;color:#999;margin-bottom:6px">Соблюдены ли правила дисциплины?</div>
  <div style="font-size:14px">${statusHtml}</div>
  ${btnHtml}
</div>`;
}

// ── MATCHES ───────────────────────────────────────────────────────────────────
function dlBar(m) {
  if (!m.rsvp_deadline) return "";
  const dl = new Date(m.rsvp_deadline), now = new Date();
  const passed = m.deadline_passed;
  const diff = dl - now;
  let cls, ico, txt;
  if (passed) {
    cls="dl-gone"; ico="🔒"; txt="Дедлайн истёк — обратись к капитану";
  } else {
    const h = Math.floor(diff/3600000), mn = Math.floor((diff%3600000)/60000);
    if (h > 48) { cls="dl-ok"; ico="📅"; txt=`Ответить до ${dl.toLocaleDateString("ru-RU",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}`; }
    else if (h > 0) { cls="dl-warn"; ico="⏰"; txt=`Осталось ${h}ч ${mn}м`; }
    else { cls="dl-warn"; ico="⚡"; txt=`Осталось ${mn} мин!`; }
  }
  return `<div class="dl-bar ${cls}">${ico} ${txt}</div>`;
}

function renderMatches() {
  const el = document.getElementById("pg-matches");
  if (!S.matches.length) {
    el.innerHTML=`<div class="empty"><div class="empty-ic">⚽</div><div class="empty-tx">Матчей пока нет</div></div>`;
    return;
  }
  el.innerHTML = S.matches.map(m => {
    const scored = m.gf !== null;
    const dt = new Date(m.match_date);
    const dateStr = dt.toLocaleDateString("ru-RU",{weekday:"short",day:"numeric",month:"long"});
    const timeStr = dt.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
    let scoreCls = "";
    if (scored) scoreCls = m.gf>m.ga?"win":m.gf<m.ga?"loss":"draw";
    const scoreHtml = scored
      ? `<span class="mc-score ${scoreCls}">${m.gf}:${m.ga}</span>`
      : `<span class="mc-score" style="color:#444">—</span>`;
    const bonusHtml = scored
      ? `<div class="mc-bonus">Бонус команды: <b>${rub(m.finance.team_bank)}</b></div>` : "";
    const rsvpHtml = !scored && !m.deadline_passed
      ? `<div class="rsvp-row" onclick="event.stopPropagation()">
           <button class="btn-yes btn-sm" onclick="doRsvp(${m.id},'yes')">✅ Играю</button>
           <button class="btn-no btn-sm" onclick="doRsvp(${m.id},'no')">❌ Не играю</button>
         </div>` : "";
    return `
<div class="card" onclick="openDetail(${m.id})" style="cursor:pointer">
  <div class="mc-top">
    <div style="min-width:0">

function loadEditMatch() {
  const mid = +document.getElementById("edm")?.value;
  const m = S.matches.find(x => x.id === mid);
  if (!m) return;
  document.getElementById("edopp").value = m.opponent || "";
  const toLocal = s => s ? s.substring(0,16) : "";
  document.getElementById("edmdt").value = toLocal(m.match_date);
  document.getElementById("edmdl").value = toLocal(m.rsvp_deadline || "");
}

async function saveEditMatch() {
  const mid = +document.getElementById("edm").value;
  const opp = document.getElementById("edopp").value.trim();
  const mdt = document.getElementById("edmdt").value;
  const mdl = document.getElementById("edmdl").value;
  if (!opp || !mdt) { toast("Укажи соперника и дату"); return; }
  try {
    await api(`/api/matches/${mid}`, {method:"PUT", body:JSON.stringify({opponent:opp, match_date:mdt, rsvp_deadline:mdl||null})});
    toast("✅ Матч обновлён");
    S.matches = await api("/api/matches");
    renderMatches(); renderCaptain();
  } catch(e) { toast("❌ "+e.message); }
}

function deleteMatch() {
  const mid = +document.getElementById("edm").value;
  const m = S.matches.find(x => x.id === mid);
  if (!m) return;
  const doDelete = async () => {
    try {
      await api(`/api/matches/${mid}`, {method:"DELETE"});
      toast("🗑 Матч удалён");
      S.matches = await api("/api/matches");
      renderMatches(); renderCaptain(); loadBank();
    } catch(e) { toast("❌ "+e.message); }
  };
  if (tg) {
    tg.showConfirm(`Удалить матч vs ${m.opponent}? Все данные (RSVP, статистика, голоса) будут удалены.`, ok => { if (ok) doDelete(); });
  } else if (confirm(`Удалить матч vs ${m.opponent}?`)) { doDelete(); }
}

  const opp = document.getElementById("opp").value.trim();

  const mdl = document.getElementById("mdl").value;
  if (!opp||!mdt) { toast("Укажи соперника и дату"); return; }

function initials(name){

  const p = name.trim().split(/\s+/);
  return p.length>=2 ? (p[0][0]+p[1][0]).toUpperCase() : name.slice(0,2).toUpperCase();
}

let lpSubs   = lpData[1].subs;

const FORMATIONS = {
  "2-1-2": {

      rw:  {abbr:"ЦН", l:"50%", t:"26%", lbl:"Центральный нападающий"},
    }
  }
};
let LP_SLOTS = FORMATIONS["2-1-2"].slots;
let lpFormation = {1:"2-1-2", 2:"2-1-2"};

function initLP(s1, sub1, s2, sub2, notes, form1, form2) {
  lpNotes = notes || "";
  lpFormation = {1: form1||"2-1-2", 2: form2||"2-1-2"};
  LP_SLOTS = FORMATIONS[lpFormation[1]].slots;
  // init data for all slots of BOTH formations so no key is ever missing
  const allSlots = Object.keys(FORMATIONS["2-1-2"].slots);
  [1,2].forEach(t => {
    const sl_map = t===1 ? (s1||{}) : (s2||{});
    const sb_map = t===1 ? (sub1||{}) : (sub2||{});
    allSlots.forEach(sl => {
      lpData[t].lineup[sl] = sl_map[sl] || null;
      lpData[t].subs[sl]   = Array.isArray(sb_map[sl]) ? [...sb_map[sl]] : [];
    });
  });
  lpTeam   = 1;
  lpLineup = lpData[1].lineup;
  lpSubs   = lpData[1].subs;
  setTimeout(() => updateFmUI(lpFormation[1]), 0);
}
function switchTeam(t) {
  if (lpTeam === t) return;
  lpTeam   = t;
  lpLineup = lpData[t].lineup;
  lpSubs   = lpData[t].subs;
  LP_SLOTS = FORMATIONS[lpFormation[t]].slots;
  document.querySelectorAll(".team-sw-btn").forEach(b => b.classList.toggle("active", +b.dataset.t === t));
  updateFmUI(lpFormation[t]);
  renderPitchTokens();
  // rebuild notes textarea if visible
  const ta = document.getElementById("notesTA");
  if (ta) ta.value = lpNotes;
}
function updateFmUI(fm) {
  document.querySelectorAll(".fm-sw-btn").forEach(b => b.classList.toggle("active", b.dataset.f === fm));
  const lbl = document.getElementById("fmLabel");
  if (lbl) lbl.textContent = FORMATIONS[fm].label;
}
async function switchFormation(f) {
  if (lpFormation[lpTeam] === f) return;
  lpFormation[lpTeam] = f;
  LP_SLOTS = FORMATIONS[f].slots;
  updateFmUI(f);
  renderPitchTokens();
  // save to server
  const mid = lpState.mid || window._lpMid;
  if (mid) {
    try {
      await api(`/api/matches/${mid}/formation`,{method:"POST",body:JSON.stringify({formation:f,team_num:lpTeam})});
    } catch(e) { toast("❌ Ошибка сохранения схемы: " + e.message); }
  }
}

function subBadgeSvg(){
  return `<svg viewBox="0 0 22 22" fill="none"><path d="M11 4C7.686 4 5 6.686 5 10S7.686 16 11 16" stroke="white" stroke-width="1.6" stroke-linecap="round"/><path d="M10 2.5L11.8 4L10 5.5" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M11 16C14.314 16 17 13.314 17 10S14.314 4 11 4" stroke="white" stroke-width="1.6" stroke-linecap="round" opacity=".55"/><path d="M12 17.5L10.2 16L12 14.5" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/></svg>`;
}
function renderPitchTokens() {
  const pm = {};
  S.players.forEach(p => pm[p.id] = p);
  const mid = window._lpMid;
  Object.keys(LP_SLOTS).forEach(slot => {
    const pte = document.getElementById("lppt-"+slot);
    const ce = document.getElementById("lpc-"+slot);
    const ne = document.getElementById("lpn-"+slot);
    const sbe = document.getElementById("lpsb-"+slot);
    if (!ce) return;
    const pid = lpLineup[slot];
    const pl = pid ? pm[pid] : null;
    const sl = LP_SLOTS[slot];
    // update position
    if (pte) {
      pte.style.left = sl.l;
      pte.style.top  = sl.t;
      if (S.me && S.me.captain) {
        pte.onclick = pid
          ? () => openPosInfo(slot, mid)
          : () => openLP(slot, mid);
        pte.style.cursor = "pointer";
      }
    }
    ce.className = "pt-c " + (pl ? (sl.keeper ? "gk" : "out") : "emp");
    ce.textContent = pid ? initials(pl.name) : sl.abbr;
    ne.textContent = pl ? pl.name.split(" ")[0] : "—";
    if (sbe) {
      const subList = lpSubs[slot] || [];
      sbe.innerHTML = subList.filter(Boolean).map(spid => {
        const sp = pm[spid]; if (!sp) return "";
        const sCls = sp.position==="Вратарь" ? " kp" : "";
        return `<div class="sub-bdg">${subBadgeSvg()}<div class="sub-av-m${sCls}">${initials(sp.name)}</div></div>`;
      }).join("");
    }
  });
}

  return `

    ${tokens}
  </div>
  ${S.me.captain ? `<button class="btn-primary" style="margin-top:12px" onclick="saveLineup(${mid})">\u{1F4BE} Сохранить состав</button>` : ""}
</div>
<div class="notes-blk">
  <div style="font-size:11px;color:#666;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">📋 Заметки к игре</div>
  ${S.me.captain
    ? `<textarea class="notes-ta" id="notesTA" rows="3" placeholder="Тактика, важные детали..." oninput="lpNotes=this.value">${lpNotes||""}</textarea>
       <button class="btn-primary" style="margin-top:8px;font-size:13px" onclick="saveNotes(${mid})">Сохранить заметки</button>`
    : (lpNotes ? `<div class="notes-ro">${lpNotes}</div>` : `<div style="color:#555;font-size:13px">Заметок нет</div>`)
  }
</div>`;
}

function openPosInfo(slot, mid) {
  const pm = Object.fromEntries((S.players||[]).map(p=>[p.id,p]));
  const sl = LP_SLOTS[slot];
  const pid = lpLineup[slot];
  const pl = pid ? pm[pid] : null;
  const subs = lpSubs[slot] || [];
  const isCap = S.me.captain;
  const piSheet = document.getElementById("piSheet");
  const subRows = subs.map((spid, i) => {
    const sp = spid ? pm[spid] : null;
    const avCls = sp ? (sp.position==="Вратарь" ? " filled kp" : " filled") : "";
    return `<div class="pi-sub-row">
      <div class="pi-sub-av${avCls}">${sp ? initials(sp.name) : "?"}</div>
      <div style="font-size:13px;font-weight:600">${sp ? sp.name : "—"}</div>
      ${isCap ? `<div style="margin-left:auto;display:flex;gap:8px;align-items:center">
        <div style="font-size:12px;color:#4a9a40;cursor:pointer" onclick="openSubPick('${slot}',${i},${mid})">✎</div>
        <div style="font-size:12px;color:#ef4444;cursor:pointer" onclick="event.stopPropagation();clearSub('${slot}',${i},${mid})">✕</div>
      </div>` : ""}
    </div>`;
  }).join("");
  const addSubBtn = isCap ? `<div class="pi-sub-row clickable" onclick="openSubPick('${slot}',${subs.length},${mid})">
    <div class="pi-sub-av" style="background:#1a3a1a;color:#4a9a40;font-size:14px;font-weight:900">+</div>
    <div style="font-size:13px;color:#4a9a40;font-weight:600">Добавить замену</div>
  </div>` : "";
  const captainActions = isCap && pl ? `<div class="pi-act-row">
    <button class="pi-act change" onclick="closePosInfo();openLP('${slot}',${mid})">↔ Сменить</button>
    <button class="pi-act remove" onclick="clearLP('${slot}',${mid})">✕ Убрать</button>
  </div>` : (!pl && isCap ? `<div style="text-align:center;padding:8px 0"><button class="btn-primary" style="font-size:13px" onclick="closePosInfo();openLP('${slot}',${mid})">+ Назначить игрока</button></div>` : "");
  piSheet.innerHTML = `
    <div style="font-size:11px;color:#666;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px">${sl.lbl}</div>
    <div class="pi-player">
      ${pl ? `<div class="pi-av${sl.keeper?" kp":""}">${initials(pl.name)}</div><div><div style="font-size:15px;font-weight:800">${pl.name}</div><div style="font-size:12px;color:#888">${pl.position||"Нет позиции"}</div></div>`
            : `<div style="font-size:14px;color:#555">Игрок не назначен</div>`}
    </div>
    <div style="font-size:11px;color:#666;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">Замены</div>
    ${subRows}
    ${addSubBtn}
    ${captainActions}
  `;
  document.getElementById("piOverlay").classList.add("open");
}
function closePosInfo(){document.getElementById("piOverlay").classList.remove("open");}

function openSubPick(slot, subIdx, mid) {
  closePosInfo();
  piMode = "sub" + subIdx;
  lpState = {slot, mid, subIdx};
  const assigned = new Set(Object.values(lpLineup).filter(Boolean));
  const allSubs = Object.values(lpSubs).flat().filter(Boolean);
  document.getElementById("lpPos").textContent = `Замена ${subIdx+1} — ${LP_SLOTS[slot].lbl}`;
  document.getElementById("lpList").innerHTML = S.players.map(pl => {
    const inStart = assigned.has(pl.id);
    const inSub = false; // same sub can cover multiple slots
    const grayed = inStart;
    const note = inStart ? " (в старте)" : "";
    return `<div class="lp-row"${grayed?" style='opacity:.3;pointer-events:none'":""} onclick="assignSub(${pl.id})">
      <div class="lp-av${pl.position==="Вратарь"?" kp":""}">${initials(pl.name)}</div>
      <div style="font-size:14px;font-weight:600">${pl.name}<span style="color:#666;font-size:11px">${note}</span></div>
    </div>`;
  }).join("");
  document.getElementById("lpOverlay").classList.add("open");
}
function assignSub(pid) {
  const {slot, mid, subIdx} = lpState;
  if (!lpSubs[slot]) lpSubs[slot] = [];
  if (subIdx >= lpSubs[slot].length) {
    lpSubs[slot].push(pid);
  } else {
    lpSubs[slot][subIdx] = pid;
  }
  closeLPicker();
  renderPitchTokens();
  openPosInfo(slot, mid);
}
function clearSub(slot, subIdx, mid) {
  if (!lpSubs[slot]) return;
  lpSubs[slot].splice(subIdx, 1);
  renderPitchTokens();
  openPosInfo(slot, mid);
}

function openLP(slot, mid) {
  piMode = "main";
  lpState = {slot, mid};
  document.getElementById("lpPos").textContent = LP_SLOTS[slot].lbl;
  const assigned = Object.values(lpLineup).filter(Boolean);
  document.getElementById("lpList").innerHTML = S.players.map(pl => {
    const taken = assigned.includes(pl.id) && lpLineup[slot] !== pl.id;
    const nm = pl.name.split(" ");
    const initials = (nm[0]||"")[0] + ((nm[1]||"")[0]||"");
    return `<div class="lp-row"${taken?" style='opacity:.35;pointer-events:none'":""} onclick="assignLP(${pl.id})">
      <div class="lp-av${pl.position==="Вратарь"?" kp":""}">${initials}</div>
      <div><div style="font-size:14px;font-weight:600">${pl.name}</div>
           <div style="font-size:11px;color:#666">${pl.position||"—"}</div></div>
    </div>`;
  }).join("");
  document.getElementById("lpOverlay").classList.add("open");
}

function closeLPicker() {
  document.getElementById("lpOverlay").classList.remove("open");
}

function assignLP(pid) {
  lpLineup[lpState.slot] = pid;
  closeLPicker();
  renderPitchTokens();
}

function clearLP() {
  lpLineup[lpState.slot] = null;
  closeLPicker();
  renderPitchTokens();
}

async function saveLineup(mid) {
  try {
    await api(`/api/matches/${mid}/lineup`,{method:"POST",body:JSON.stringify({lineup:lpLineup,subs:lpSubs,team_num:lpTeam})});
    toast(`✅ Состав ${lpTeam} сохранён`);
  } catch(e) { toast("❌ " + e.message); }
}
async function saveNotes(mid) {
  try {
    const ta = document.getElementById("notesTA");
    lpNotes = ta ? ta.value : lpNotes;
    await api(`/api/matches/${mid}/notes`,{method:"POST",body:JSON.stringify({notes:lpNotes})});
    toast("✅ Заметки сохранены");
  } catch(e) { toast("❌ " + e.message); }
}

boot();
function voteAdminHtml(m) {
  if (!S.me?.captain || m.gf === null) return "";
  const players = (m.stats || []).filter(s => s.played);
  if (!players.length) return "";
  const ov = m.vote_overrides || {};
  const rows = players.map(p => {
    const cur = ov[p.player_id] || {mvp:0,defense:0};
    return `<div style="display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid #1e1e1e">
      <div style="flex:1;font-size:13px">${esc(p.name)}</div>
      <input type="number" min="0" max="99" value="${cur.mvp}" id="vov-mvp-${p.player_id}"
        style="width:38px;background:#1a1a1a;border:1px solid #333;border-radius:6px;color:#eee;font-size:12px;padding:2px 4px;text-align:center">
      <input type="number" min="0" max="99" value="${cur.defense}" id="vov-def-${p.player_id}"
        style="width:38px;background:#1a1a1a;border:1px solid #333;border-radius:6px;color:#eee;font-size:12px;padding:2px 4px;text-align:center">
    </div>`;
  }).join("");
  return `
<div class="sect">✏️ Редактор голосов</div>
<div class="card" style="padding:12px">
  <div style="font-size:11px;color:#666;margin-bottom:8px">Ручное переопределение (заменяет реальные голоса)</div>
  <div style="display:flex;justify-content:flex-end;gap:4px;margin-bottom:4px;font-size:10px;color:#555">
    <span style="width:38px;text-align:center">⭐MVP</span>
    <span style="width:38px;text-align:center">🛡Защ</span>
  </div>
  ${rows}
  <button onclick="saveVoteAdmin(${m.id},[${players.map(p=>p.player_id).join(',')}])"
    style="margin-top:10px;width:100%;padding:8px;background:#1e3a1e;border:1px solid #22c55e;border-radius:8px;color:#22c55e;font-size:13px;font-weight:600">
    💾 Сохранить голоса
  </button>
</div>`;
}

async function saveVoteAdmin(mid, playerIds) {
  const overrides = playerIds.map(pid => ({
    player_id: pid,
    mvp: parseInt(document.getElementById(`vov-mvp-${pid}`)?.value||"0")||0,
    defense: parseInt(document.getElementById(`vov-def-${pid}`)?.value||"0")||0,
  }));
  try {
    await api(`/api/matches/${mid}/votes/admin`,{method:"POST",body:JSON.stringify({overrides})});
    toast("✅ Голоса сохранены");
    await renderDetail(mid);
  } catch(e) { toast("❌ "+e.message); }
}
